[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-orchestrator"
version = "0.1.0"
description = "Hierarchical multi-agent task orchestration platform with a live visual dashboard: a Planner decomposes requests into a DAG of subtasks, a scheduler dispatches them to typed Worker agents, results are persisted on a shared Blackboard, and a Synthesizer produces a cited final answer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samir Rafigzada", email = "rafigzadasamir@gmail.com" }]
keywords = [
    "multi-agent",
    "orchestration",
    "llm",
    "dag",
    "fastapi",
    "websocket",
    "agents",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.109,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "anthropic>=0.40",
    "pydantic>=2.5,<3.0",
    "httpx>=0.26,<1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0"]

[project.scripts]
ai-agent-orchestrator = "ai_agent_orchestrator.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_agent_orchestrator.dashboard" = ["static/*.html"]
"ai_agent_orchestrator" = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
